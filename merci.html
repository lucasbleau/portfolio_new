<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Envoyé — Lucas Bleau</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(44vw 44vw at 12% 10%, rgba(125, 190, 240, 0.6), transparent 70%), radial-gradient(44vw 44vw at 88% 88%, rgba(165, 182, 205, 0.6), transparent 70%), #f4f6f9;
            color: #1f2a37;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.36));
            backdrop-filter: blur(22px) saturate(170%);
            -webkit-backdrop-filter: blur(22px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 0 14px rgba(255, 255, 255, 0.35), 0 10px 30px rgba(45, 75, 110, 0.13);
            padding: 3rem 2.5rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.75rem;
            background: #e7f1fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s ease 0.15s both;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .check-wrap svg {
            stroke: #2f74b5;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #1f2a37;
            margin-bottom: 1rem;
        }

        p {
            color: #47566a;
            font-size: 0.9rem;
            line-height: 1.75;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: #2f74b5;
            color: #ffffff;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: #255f96;
            transform: translateY(-2px);
            box-shadow: 0 2px 4px rgba(31, 42, 55, 0.04), 0 8px 20px rgba(31, 42, 55, 0.07);
        }

        .countdown {
            margin-top: 1.5rem;
            margin-bottom: 0;
            font-size: 0.8rem;
            color: #5f6e82;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="check-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5" />
            </svg>
        </div>
        <h1>Message Envoyé</h1>
        <p>Merci pour votre message. Je l'ai bien reçu et vous répondrai dans les meilleurs délais.</p>
        <a href="index.html" class="btn">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 10L5 10M5 10L9 6M5 10L9 14" />
            </svg>
            Retour au portfolio
        </a>
        <p class="countdown">Redirection dans <span id="countdown">5</span>s</p>
    </div>

    <script>
        let s = 5;
        const el = document.getElementById('countdown');
        const t = setInterval(() => {
            s--;
            el.textContent = s;
            if (s === 0) { clearInterval(t); window.location.href = 'index.html'; }
        }, 1000);
    </script>
</body>

</html>
